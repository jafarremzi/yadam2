name: Android CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest از قبل Android SDK دارد (ANDROID_HOME)؛ نیازی به setup-android نیست
      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # خروجی 141 (SIGPIPE) از yes عادی است و نباید job را شکست بدهد
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint (advisory)
        continue-on-error: true
        run: ./gradlew lintDebug --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          test -n "$APK" || { echo "APK not found"; exit 1; }
          ls -lh "$APK"
          cp "$APK" YadAvar-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YadAvar-debug-apk
          path: YadAvar-debug.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  release:
    # فقط با Tag مثل v1.0.0 و فقط پس از موفقیت کامل build و تست‌ها
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: YadAvar-debug-apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: YadAvar-debug.apk
          generate_release_notes: true
